name: Deploy OSINT Analyzer

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of
# cancelling it halfway through a container swap
concurrency:
  group: deploy-osint
  cancel-in-progress: false

permissions:
  contents: read

env:
  REMOTE_DIR: /opt/docker-homelab/sites/osint/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # better-sqlite3 needs Node 22; same as the Dockerfile's node:22-alpine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A commit that doesn't install or build never reaches the server
      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync source to the homelab
        run: |
          rsync -az --delete \
            --exclude='node_modules' --exclude='.next' --exclude='.git' \
            --exclude='.env*' --exclude='data' --exclude='design' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.HOMELAB_HOST }}:${REMOTE_DIR}"

      - name: Back up, rebuild and swap only the osint container
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.DEPLOY_USER }}@${{ secrets.HOMELAB_HOST }}" 'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd /opt/docker-homelab

          # Bad compose YAML stops here, before anything is rebuilt or restarted
          docker compose config -q

          # Snapshot the database from the running (old) container, so a
          # rollback can restore it; skipped on the very first deploy
          if [ -n "$(docker compose ps -q osint 2>/dev/null)" ]; then
            docker compose exec -T osint node - < sites/osint/scripts/backup-db.cjs
          else
            echo "osint is not running yet: no backup taken"
          fi

          # Keep the current image as :previous for a one-command rollback
          # (tagged, so the prune below leaves it alone). Needs
          # "image: osint-analyzer:latest" on the service; see DEPLOY.md.
          if docker image inspect osint-analyzer:latest >/dev/null 2>&1; then
            docker tag osint-analyzer:latest osint-analyzer:previous
          fi

          # The old container keeps serving while the new image builds
          docker compose build osint

          # Recreates osint only; nginx, cloudflared and everything else untouched
          docker compose up -d --no-deps osint

          # Wait up to 60 s for the new container to answer from inside itself
          deadline=$((SECONDS + 60))
          # </dev/null: exec forwards stdin, which here is the rest of this script
          until docker compose exec -T osint wget -q -O /dev/null http://127.0.0.1:3000/api/health </dev/null 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::osint did not answer on http://127.0.0.1:3000/api/health within 60 s"
              docker compose logs --no-color --tail 50 osint
              exit 1
            fi
            sleep 3
          done
          echo "osint is healthy"

          docker image prune -f
          docker compose ps osint
          DEPLOY

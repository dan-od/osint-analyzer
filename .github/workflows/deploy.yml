name: Deploy OSINT Analyzer

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of
# cancelling it halfway through a container swap
concurrency:
  group: deploy-osint
  cancel-in-progress: false

permissions:
  contents: read

env:
  REMOTE_DIR: /opt/docker-homelab/sites/osint/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # better-sqlite3 needs Node 22; same as the Dockerfile's node:22-alpine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A commit that doesn't install or build never reaches the server
      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync source to the homelab
        run: |
          rsync -az --delete \
            --exclude='node_modules' --exclude='.next' --exclude='.git' \
            --exclude='.env*' --exclude='data' --exclude='design' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.HOMELAB_HOST }}:${REMOTE_DIR}"

      - name: Build, back up, then swap only the osint container
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.DEPLOY_USER }}@${{ secrets.HOMELAB_HOST }}" 'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd /opt/docker-homelab

          # 1. Bad compose YAML stops here, before anything is built or restarted
          docker compose config -q

          # 2. Keep the image osint is running as :previous for rollback. Done
          #    BEFORE the build, while that image still has its tag: once the
          #    build moves osint-analyzer:latest, an untagged image may not be
          #    findable by id (containerd image store). Tagged, so the prune at
          #    the end leaves it alone. A failure here only costs the one-line
          #    rollback, never the deploy.
          running_cid="$(docker compose ps -q osint 2>/dev/null || true)"
          if [ -z "$running_cid" ]; then
            echo "No running osint container: no previous image to keep"
          else
            running_image="$(docker inspect --format '{{.Image}}' "$running_cid" 2>/dev/null || true)"
            latest_image="$(docker image inspect --format '{{.Id}}' osint-analyzer:latest 2>/dev/null || true)"
            if [ -n "$running_image" ] && [ "$running_image" = "$latest_image" ] \
                && docker tag osint-analyzer:latest osint-analyzer:previous 2>/dev/null; then
              echo "Tagged the running image (osint-analyzer:latest, ${running_image:7:12}) as osint-analyzer:previous"
            elif [ -n "$running_image" ] && docker tag "$running_image" osint-analyzer:previous 2>/dev/null; then
              echo "Tagged the running image ${running_image:7:12} as osint-analyzer:previous"
            else
              echo "::warning::Could not tag the running image (${running_image:-unknown}) as osint-analyzer:previous; osint-analyzer:previous is unchanged. Rollback for this deploy: git revert and redeploy (database backup below)."
            fi
          fi

          # 3. Build the new image; the old container keeps serving meanwhile
          docker compose build osint

          # 4. Back up the database with the NEW image (a one-off container with
          #    the service's volumes and env). No database yet: logged, carry on.
          #    A database that can't be backed up: the script exits non-zero and
          #    set -e stops the deploy here, before anything is swapped.
          #    stdin is the backup script, not the rest of this one.
          echo "Backing up the database from the new image"
          docker compose run --rm --no-deps -T osint node - < sites/osint/scripts/backup-db.cjs

          # 5. Recreate osint only; nginx, cloudflared and everything else untouched
          docker compose up -d --no-deps osint

          # 6. Wait up to 60 s for the new container to answer from inside itself
          deadline=$((SECONDS + 60))
          # </dev/null: exec forwards stdin, which here is the rest of this script
          until docker compose exec -T osint wget -q -O /dev/null http://127.0.0.1:3000/api/health </dev/null 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::osint did not answer on http://127.0.0.1:3000/api/health within 60 s"
              docker compose logs --no-color --tail 50 osint
              exit 1
            fi
            sleep 3
          done
          echo "osint is healthy"

          docker image prune -f
          docker compose ps osint
          DEPLOY
